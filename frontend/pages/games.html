<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-900 py-4 px-8">
    <header class="bg-zinc-900 text-white py-4 items-center px-4">
      <div class="flex justify-between mb-6">
        <h1 class="text-2xl font-bold">G A M E S</h1>
        <button
          onclick="window.location.href='../index.html'"
          class="bg-neutral-700 py-2 px-4 rounded-full aspect-square text-gray-300"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </div>
      <input
        type="text"
        id="search"
        placeholder="Search games"
        class="bg-neutral-700 rounded-full py-2 px-4 text-gray-300 w-full"
      />
    </header>

    <div class="container mx-auto px-4 py-6">
      <div class="filters flex justify-between mb-4">
        <select
          id="orderby"
          class="bg-neutral-800 text-white rounded-md py-2 px-4 mb-2"
        >
          <option value="rele">Order by Relevance</option>
          <option value="released">Order by Release Date</option>
          <option value="metacritic">Order by Metacritic</option>
        </select>
      </div>

      <div id="games" class="flex flex-col gap-6"></div>
    </div>

    <script src="../js/games.js"></script>
  </body>
</html>
