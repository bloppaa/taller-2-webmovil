<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100">
    <header class="bg-gray-800 text-white py-4 text-center">
      <h1 class="text-2xl font-bold">Games</h1>
    </header>

    <div class="container mx-auto px-4 py-6">
      <div class="filters flex justify-between mb-4">
        <input
          type="text"
          id="search"
          placeholder="Search games..."
          class="border border-gray-300 rounded-md p-2 w-1/2"
        />
        <select
          id="orderby"
          class="border border-gray-300 rounded-md p-2 w-1/3"
        >
          <option value="released">Order by Release Date</option>
          <option value="metacritic">Order by Metacritic</option>
        </select>
      </div>

      <div
        id="games"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>
    </div>

    <script src="../js/games.js"></script>
  </body>
</html>
