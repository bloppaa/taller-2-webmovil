<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/pokemon.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <template id="pokemon-card-template">
      <a class="pokemon-card">
        <div class="aspect-square bg-gray-200 rounded-xl">
          <img class="pokemon-image" />
        </div>
        <p class="pokemon-id pl-2 text-gray-500 font-semibold text-sm"></p>
        <p class="pokemon-name pl-2 pt-2 text-lg font-semibold"></p>
        <div class="pl-2">
          <span
            class="pokemon-type inline-block text-xs px-2 rounded-sm w-14 text-center"
          ></span>
          <span
            class="pokemon-type inline-block text-xs px-2 rounded-sm w-14 text-center"
          ></span>
        </div>
      </a>
    </template>

    <div class="flex justify-center">
      <div class="flex flex-col items-center max-w-3xl m-8 gap-6">
        <div class="flex justify-between w-full px-8">
          <div class="w-full text-3xl text-zinc-500">Pokédex</div>
          <button
            onclick="window.location.href='../index.html'"
            class="text-white bg-orange-400 w-12 rounded-full aspect-square"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
        </div>

        <div
          class="black-div bg-zinc-800 py-6 w-screen gap-4 flex flex-col justify-center items-center"
        >
          <div class="search-div w-full h-24 px-8 flex flex-col gap-4">
            <div class="text-white text-2xl">Nombre o número</div>

            <div class="flex justify-between gap-2">
              <div class="relative w-full">
                <input
                  id="search-input"
                  type="text"
                  class="w-full h-10 rounded-md bg-white px-4 mr-2"
                />

                <button
                  id="clear-button"
                  type="button"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
                  style="display: none"
                >
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <button
                id="search-button"
                class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-2 rounded-md cursor-pointer transition-colors"
              >
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>

          <div class="search-info text-white bg-green-600 rounded-xl mx-8 p-4">
            Busca un Pokémon por su nombre o usando su número de la Pokédex
            Nacional.
          </div>
        </div>

        <div
          id="no-results-message"
          class="hidden flex flex-col items-center gap-4"
        >
          <p class="text-red-400 text-xl font-semibold">
            Ningún Pokémon coincide con tu búsqueda.
          </p>
        </div>

        <div id="pokemon-controls" class="flex justify-between w-full px-4">
          <button
            id="random-button"
            class="px-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-lg cursor-pointer transition-colors flex flex-col justify-center"
          >
            <i class="fa-solid fa-shuffle"></i>
            ¡Sorpréndeme!
          </button>

          <div class="flex-0">
            <label for="pokemon-order-select" class="font-semibold text-lg"
              >Ordenar por</label
            >

            <select
              id="pokemon-order-select"
              name="pokemon"
              class="p-3 rounded-lg bg-black text-white"
            >
              <option value="inf">Número inferior</option>

              <option value="sup">Número superior</option>
            </select>
          </div>
        </div>
        <div
          id="pokemon-container"
          class="flex flex-wrap justify-center gap-6 mx-4"
        ></div>
        <div class="loader hidden"></div>
        <div class="flex justify-center">
          <button
            id="load-more-button"
            class="hidden mt-8 bg-sky-500 hover:bg-sky-600 text-white font-semibold px-6 py-2 rounded-md cursor-pointer transition-colors"
          >
            Cargar más Pokémon
          </button>
        </div>
      </div>
    </div>
  </body>

  <script src="../js/pokemon.js"></script>
</html>
